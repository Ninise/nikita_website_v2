:root {
  --sky: #bfe7f8;
  --cloud: #ffffff;

  --ink: #16301b;
  --ink-soft: #3c5a40;
  --panel: #ffffff;
  --line: #d9e8d2;
  --chip: #ffffff;
  --chip-hover: #fff3c4;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #12233b; --cloud: #2d4466; --fog: #dbe6f2; --ink: #eef6e6; --ink-soft: #b8cdb5; --panel: #1d2f26; --line: #355043; --chip: #1d2f26; --chip-hover: #2b4437;
  }
}
:root[data-theme="dark"] {
  --sky: #12233b; --cloud: #2d4466; --fog: #dbe6f2; --ink: #eef6e6; --ink-soft: #b8cdb5; --panel: #1d2f26; --line: #355043; --chip: #1d2f26; --chip-hover: #2b4437;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: 'Nunito', system-ui, sans-serif; line-height: 1.55; }
button { font: inherit; color: inherit; }

.wrap { max-width: 1400px; margin: 0 auto; padding: 16px 16px 8px; }
.stage { position: relative; }
.intro { padding: 8px 4px 0; }
h1, h2, h3 { font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: clamp(2.1rem, 4.4vw, 2.8rem); line-height: 1.05; }
.intro p { margin: 10px 0 12px; color: var(--ink-soft); max-width: 36ch; font-size: 1rem; }
.intro p.hint { margin: 0 0 12px; font-size: .88rem; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--chip); border: 0; border-radius: 999px; padding: 7px 15px; font-weight: 700; font-size: 0.92rem; cursor: pointer; box-shadow: 0 2px 0 rgba(22, 48, 27, 0.18); transition: transform .15s, background-color .15s; }
.chip:hover { background: var(--chip-hover); transform: translateY(-2px); }
.chip:focus-visible, .close:focus-visible, .btn:focus-visible, .item a:focus-visible, .zbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

svg#city { display: block; width: 100%; height: auto; overflow: hidden; border-radius: 22px; }
.rise { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
.drift { animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translateX(-26px); } to { transform: translateX(26px); } }
.fog ellipse { fill: var(--fog); opacity: .85; }
.roll { animation: roll 34s linear infinite; }
@keyframes roll {
  0% { opacity: 0; transform: translate(-110px, 55px); }
  18% { opacity: 1; }
  82% { opacity: 1; }
  100% { opacity: 0; transform: translate(130px, -65px); }
}
.bld { cursor: pointer; transition: transform .2s ease, filter .2s ease; outline: none; }
.bld:hover, .bld:focus-visible { transform: translateY(-10px); filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff); }
.tag { cursor: pointer; }
.tag.static { cursor: default; }
.tag .pill { fill: #fff; transition: fill .15s; }
.tag:not(.static):hover .pill { fill: #fff3c4; }
.tag text { font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; font-size: 15px; fill: #16301b; }
.sign { font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; pointer-events: none; }
.rotor { transform-box: fill-box; transform-origin: center; animation: buzz .1s linear infinite alternate; }
@keyframes buzz { from { transform: scaleX(1); } to { transform: scaleX(.55); } }

.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.zbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--chip); font-weight: 700; font-size: 1.1rem; cursor: pointer; box-shadow: 0 2px 0 rgba(22, 48, 27, 0.18); transition: transform .15s, background-color .15s; }
.zbtn:hover { background: var(--chip-hover); transform: translateY(-2px); }
.zbtn.fit { font-size: .72rem; }

.panel { position: fixed; right: 8px; top: 8px; width: min(360px, calc(100% - 16px)); max-height: calc(100vh - 16px); overflow: auto; background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 22px; padding: 22px 22px 20px; z-index: 5; opacity: 0; visibility: hidden; transform: translateY(10px) scale(.98); transition: opacity .2s, transform .25s cubic-bezier(.2, .8, .2, 1), visibility 0s .25s; }
.panel.open { opacity: 1; visibility: visible; transform: none; transition: opacity .2s, transform .25s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
.panel h2 { font-size: 1.6rem; margin-right: 36px; }
.panel .lead { margin: 6px 0 4px; color: var(--ink-soft); }
.panel p { margin: 10px 0 0; }
.close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--chip-hover); cursor: pointer; display: grid; place-items: center; }
.item { padding: 12px 0 2px; margin-top: 12px; border-top: 2px dotted var(--line); }
.item h3 { font-size: 1.1rem; }
.item p { margin: 2px 0 6px; color: var(--ink-soft); }
.item a { font-weight: 700; color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 2px; }
.chip.mini { padding: 5px 13px; font-size: .85rem; border: 2px solid var(--line); box-shadow: none; margin: 2px 0 6px; }
.bul { margin: 10px 0 0; padding-left: 18px; }
.bul li { margin: 0 0 8px; color: var(--ink-soft); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { display: inline-block; padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--panel); font-weight: 700; text-decoration: none; }
.btn:hover { background: var(--accent); color: #fff; }
footer { text-align: center; padding: 6px 16px 20px; font-size: 0.85rem; color: var(--ink-soft); }

@media (min-width: 900px) {
  .intro { position: absolute; left: 14px; top: 14px; z-index: 2; max-width: 380px; padding: 14px 18px 18px; border-radius: 22px; background: color-mix(in srgb, var(--sky) 80%, transparent); }

@media (prefers-reduced-motion: reduce) {

/* ---------- time of day, lights and little animations ---------- */
body { transition: background-color 1.2s ease; }
svg#city { isolation: isolate; }
#celestial, #tint, #lights, #gulls, .walker, .puff { pointer-events: none; }
.bob, .graze, .flap, .puff, .twk { transform-box: fill-box; transform-origin: center; }
.bob { animation: bob 3.4s steps(5) infinite alternate; }

.flap { animation: flap .42s ease-in-out infinite alternate; }

.puff { animation: puff 3.9s ease-out infinite; }

@keyframes wag { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
.twk { animation: twk 2.6s steps(3) infinite alternate; }
.beacon { animation: twk 1.1s steps(2) infinite alternate; }
@keyframes twk { from { opacity: .25; } to { opacity: 1; } }
.clock { position: absolute; left: 14px; bottom: 14px; z-index: 3; display: flex; align-items: center; gap: 8px; }
.clock .dot { width: 12px; height: 12px; border-radius: 50%; background: #ffd24d; box-shadow: 0 0 0 3px rgba(255, 210, 77, .3); }
.clock:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* the page palette follows the sky, not the device theme */
:root.tod-day { --ink: #16301b; --ink-soft: #3c5a40; --panel: #ffffff; --line: #d9e8d2; --chip: #ffffff; --chip-hover: #fff3c4; --fog: #ffffff; }

@media (prefers-reduced-motion: reduce) {
  .bob, .sealy, .graze, .swim, .fly, .flap, .puff, .wag, .twk, .beacon { animation: none; }
  body { transition: none; }
}
</style>

  function list(arr) {
    return arr.map(function (it) {
      return '<div class="item"><h3>' + it.t + '</h3><p>' + it.d + '</p>' + (it.l ? '<a href="' + it.l + '" target="_blank" rel="noopener">' + (it.ll || 'Read more') + '</a>' : '') + (it.open ? '<button class="chip mini" data-open="' + it.open + '">' + (it.ll || 'Open') + '</button>' : '') + '</div>';
    }).join('');
  }
  function body(id) {
    var c = CONTENT[id], h = '';
    if (c.lead) h += '<p class="lead">' + c.lead + '</p>';
    if (c.paras) h += c.paras.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    if (c.bullets) h += '<ul class="bul">' + c.bullets.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>';
    if (c.items) h += list(c.items);
    if (c.links) h += '<div class="btns">' + c.links.map(function (l) { return '<a class="btn" href="' + l.l + '" target="_blank" rel="noopener">' + l.t + '</a>'; }).join('') + '</div>';
    return h;
  }
  function open(id, trigger) {
    pTitle.textContent = CONTENT[id].title;
    pBody.innerHTML = body(id);
    last = trigger || null;
    panel.scrollTop = 0;
    panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
    closeBtn.focus({ preventScroll: true });
  }
  function close() {
    panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
    if (last && last.focus) last.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-open]') : null;
    if (t) open(t.getAttribute('data-open'), t);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && panel.classList.contains('open')) close();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('bld')) { e.preventDefault(); open(e.target.getAttribute('data-open'), e.target); }
  });
  closeBtn.addEventListener('click', close);
  document.getElementById('site-name').textContent = CONTENT.name;
})();
</script>
</body>
</html>
